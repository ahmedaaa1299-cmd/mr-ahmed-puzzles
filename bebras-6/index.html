<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bebras Mini Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Mini Test: 5 tasks x 4 versions on a timer, marked only at the end, like the real Bebras platform. */
:root {
  --bg: #F4EFE6; --surface: #FFFFFF; --sunk: #EAE2D3; --ink: #2B1E12; --muted: #6E5B47; --line: #D6C8B2;
  --teal: #1F7A6D; --teal-ink: #FFFFFF; --star: #E8A317; --coral: #D24D2C; --good: #13804A;
  --red: #E4572E; --blue: #3E7FDB; --lane0: #7A3B2E; --lane1: #2F6FC7; --lane2: #6B3FA0; --fin: #13804A;
  --display: "Baloo Bhaijaan 2", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A140E; --surface: #2A2119; --sunk: #221B14; --ink: #F3EADC; --muted: #BBA88F; --line: #4A3C2E;
    --teal: #4FC3B3; --teal-ink: #10221F; --star: #FFC233; --coral: #FF7A55; --good: #4FD18B;
    --lane0: #D98A72; --lane1: #6EA8F5; --lane2: #B892F0; --fin: #4FD18B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A140E; --surface: #2A2119; --sunk: #221B14; --ink: #F3EADC; --muted: #BBA88F; --line: #4A3C2E;
  --teal: #4FC3B3; --teal-ink: #10221F; --star: #FFC233; --coral: #FF7A55; --good: #4FD18B;
  --lane0: #D98A72; --lane1: #6EA8F5; --lane2: #B892F0; --fin: #4FD18B; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; margin: 0; }
.app { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 32px; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--star); outline-offset: 2px; }
button:disabled { cursor: default; opacity: .45; }
h1, h2 { font-family: var(--display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; } h2 { font-size: 24px; }
p { margin: 0; }
.top { display: flex; align-items: center; gap: 12px; }
.top img { width: 74px; height: auto; background: #fff; border-radius: 10px; padding: 4px; border: 1px solid var(--line); }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.who b { font-family: var(--display); font-size: 17px; line-height: 1.2; }
.who span { font-size: 13px; color: var(--muted); }
.langBtn { border: 2px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; box-shadow: 0 3px 0 var(--ink); }
.panel { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 0 var(--ink); }
.eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.headrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.score { font-family: var(--display); font-weight: 800; font-size: 20px; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
.score .st { color: var(--star); }
.rules { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.instr { background: var(--sunk); border-radius: 10px; padding: 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.tab .s { color: var(--star); letter-spacing: 1px; }
.tab.cur { background: var(--ink); color: var(--bg); }
.tab.ok::after { content: "✓"; color: var(--good); font-weight: 800; }
.tab.cur.ok::after { color: #7BE0A8; }
.lbl { font-weight: 700; color: var(--muted); font-size: 14px; }
.lineup { display: flex; flex-direction: column; gap: 4px; }
.toks { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 40px; }
.tok { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; line-height: 1; border: 2px solid var(--ink); background: var(--surface); position: relative; }
.tok.red { background: var(--red); } .tok.blue { background: var(--blue); }
.tok.bad::after { content: "✗"; position: absolute; top: -8px; inset-inline-end: -6px; background: var(--coral); color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.tok.miss { opacity: .35; border-style: dashed; }
.arrow { color: var(--muted); font-weight: 800; }
.boardWrap { direction: ltr; display: flex; justify-content: center; }
.board { width: 100%; max-width: 440px; height: auto; display: block; touch-action: manipulation; }
.slot { cursor: pointer; }
.slot rect.box { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 5 4; }
.slot.filled rect.box { stroke-dasharray: none; }
.slot.sel rect.box { stroke: var(--star); stroke-width: 5; stroke-dasharray: none; }
.slot:focus { outline: none; } .slot:focus-visible rect.box { stroke: var(--star); stroke-width: 5; }
.palette { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.pbtn { width: 54px; height: 54px; border-radius: 12px; border: 2px solid var(--ink); background: var(--surface); font-size: 26px; box-shadow: 0 3px 0 var(--ink); display: grid; place-items: center; padding: 0; }
.pbtn .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); display: block; }
.pbtn.on { background: color-mix(in srgb, var(--star) 40%, var(--surface)); }
.pbtn.x { font-size: 20px; font-weight: 800; }
.hint { text-align: center; font-size: 14px; color: var(--muted); font-weight: 700; min-height: 1.4em; }
.btn { background: var(--teal); color: var(--teal-ink); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 18px; font-family: var(--display); font-weight: 700; font-size: 19px; box-shadow: 0 4px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: var(--surface); color: var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
.res { display: grid; grid-template-columns: 1fr; gap: 8px; }
.resBox { border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.resBox.fin { border-color: var(--fin); }
.verdict { font-weight: 800; text-align: center; border-radius: 10px; padding: 10px; }
.verdict.ok { background: color-mix(in srgb, var(--good) 20%, var(--surface)); }
.verdict.no { background: color-mix(in srgb, var(--coral) 16%, var(--surface)); }
.explain { border: 2px dashed var(--teal); border-radius: 10px; padding: 12px; }
.explain b { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); margin-bottom: 4px; }
.note { font-size: 13px; color: var(--muted); text-align: center; }
.foot { text-align: center; font-size: 13px; color: var(--muted); }
@media (max-width: 420px) { h1 { font-size: 28px; } .pbtn { width: 44px; height: 44px; font-size: 22px; } .pbtn .dot { width: 26px; height: 26px; } .tok { width: 34px; height: 34px; font-size: 19px; } }
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>

<style>
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 14px; font-family: var(--display); font-weight: 800; font-size: 22px; }
.bar .tm { font-variant-numeric: tabular-nums; direction: ltr; }
.bar .tm.low { color: #FF9A7A; }
.bar button { border: 2px solid var(--bg); background: transparent; color: var(--bg); border-radius: 10px; padding: 4px 12px; font-family: var(--body); font-weight: 700; font-size: 15px; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.tcard { border: 2px solid var(--ink); border-radius: 12px; background: var(--surface); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 4px 0 var(--ink); }
.tcard .ic { font-size: 40px; line-height: 1.1; }
.tcard .nm { font-weight: 700; color: var(--teal); text-align: center; }
.stars { letter-spacing: 3px; font-size: 20px; color: var(--line); direction: ltr; }
.stars .sv { color: var(--teal); }
.tab.sv::after { content: "●"; color: var(--teal); font-size: 10px; }
.tab.cur.sv::after { color: #8FE3D6; }
.q { font-size: 17px; }
.q b { color: var(--teal); }
.rule { font-weight: 800; font-size: 19px; text-align: center; background: var(--sunk); border-radius: 10px; padding: 8px; }
.vis { direction: ltr; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.machine { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; font-family: var(--display); font-weight: 800; font-size: 22px; }
.machine .bx { border: 2px solid var(--ink); border-radius: 10px; padding: 4px 12px; background: var(--surface); }
.machine .op { background: var(--ink); color: var(--bg); }
.machine .io { background: color-mix(in srgb, var(--star) 35%, var(--surface)); }
.machine .ar { color: var(--muted); }
.mlabel { font-weight: 700; color: var(--muted); font-size: 14px; }
.lrow { display: inline-flex; gap: 6px; align-items: flex-start; direction: ltr; }
.lrow .lc { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--muted); }
.lrow .l { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); background: var(--sunk); display: block; }
.lrow .l.on { background: var(--star); box-shadow: 0 0 0 3px color-mix(in srgb, var(--star) 35%, transparent); }
.lrow.big .l { width: 46px; height: 46px; }
.lrow.big .lc { font-size: 18px; color: var(--ink); font-family: var(--display); }
.seq { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.seq .sr { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 800; font-size: 20px; }
.map { width: 100%; max-width: 420px; height: auto; display: block; }
.rgrid { display: grid; grid-template-columns: 26px repeat(5, 40px); grid-auto-rows: 40px; gap: 3px; font-weight: 700; color: var(--muted); }
.rgrid span { display: grid; place-items: center; }
.rgrid .c { border: 2px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 24px; }
.prog { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; }
.prog .blk { border: 2px solid var(--ink); border-radius: 10px; padding: 4px 12px; background: var(--surface); }
.prog .rep { background: color-mix(in srgb, var(--star) 35%, var(--surface)); }
.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.opt { border: 2px solid var(--ink); border-radius: 12px; background: var(--surface); padding: 10px 8px; font-family: var(--display); font-weight: 800; font-size: 20px; box-shadow: 0 3px 0 var(--ink); min-height: 54px; }
.opt.sel { background: color-mix(in srgb, var(--star) 45%, var(--surface)); }
.numRow { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.numIn { width: 120px; font: inherit; font-family: var(--display); font-weight: 800; font-size: 26px; text-align: center; border: 2px solid var(--ink); border-radius: 12px; padding: 6px; background: var(--surface); color: var(--ink); }
.saved { text-align: center; font-size: 14px; font-weight: 700; color: var(--teal); min-height: 1.4em; }
.big { font-family: var(--display); font-weight: 800; font-size: 54px; text-align: center; line-height: 1.1; }
.rv { border: 2px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.rv h2 { font-size: 21px; display: flex; justify-content: space-between; gap: 8px; }
.rl { border-top: 1px dashed var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.rl .hd { font-weight: 800; }
.rl .good { color: var(--good); } .rl .bad { color: var(--coral); }
.rl .ansline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rl .exl { color: var(--muted); }
@media (max-width: 420px) { .rgrid { grid-template-columns: 22px repeat(5, 36px); grid-auto-rows: 36px; } .opt { font-size: 17px; } .lrow .l { width: 24px; height: 24px; } .lrow.big .l { width: 38px; height: 38px; } }
</style>

      c.appendChild(el("span", "ic", tk.icon)); c.appendChild(el("span", "nm", tk.name[S.lang]));
      var st = el("span", "stars"); tk.levels.forEach(function (_, j) { var a = S.ans[i][j]; st.appendChild(el("span", a != null && a !== "" ? "sv" : "", "★")); }); c.appendChild(st);
      g.appendChild(c);
    });
    p.appendChild(g); p.appendChild(el("div", "hint", t("legend")));
    var row = el("div", "row"), f = btn("btn alt", S.sure ? t("sure") : t("finish"), function () { if (S.sure) finish(false); else { S.sure = true; render(); } }); f.id = "finishBtn"; row.appendChild(f); p.appendChild(row);
  }
  function taskScreen(p) {
    var tk = TASKS[S.task], L = tk.levels[S.lv];
    p.appendChild(bar(true));
    p.appendChild(el("h2", "", tk.icon + " " + tk.name[S.lang]));
    var tabs = el("div", "tabs");
    tk.levels.forEach(function (_, i) {
      var a = S.ans[S.task][i], b = btn("tab" + (i === S.lv ? " cur" : "") + (a != null && a !== "" ? " sv" : ""), "", function () { S.lv = i; render(); });
      b.id = "ver" + i; b.innerHTML = t("version") + ' <span class="s">' + stars(i + 1) + "</span>"; b.setAttribute("aria-label", t("version") + " " + (i + 1)); tabs.appendChild(b);
    });
    p.appendChild(tabs);
    p.appendChild(el("p", "q", tk.q[S.lang] + (L.q ? " " + L.q[S.lang] : "")));
    if (L.rule) { var rl = el("div", "rule"); rl.id = "rule"; rl.textContent = t("rule") + L.rule[S.lang]; p.appendChild(rl); }
    if (L.vis) { var v = el("div", "vis"); v.innerHTML = L.vis(S.lang); p.appendChild(v); }
    var cur = S.ans[S.task][S.lv], savedEl = el("div", "saved", cur != null && cur !== "" ? t("saved") : ""); savedEl.id = "saved";
    if (L.type === "mc") {
      var o = el("div", "opts");
      L.opts.forEach(function (op, i) { var b = btn("opt" + (cur === i ? " sel" : ""), "", function () { S.ans[S.task][S.lv] = i; render(); }); b.id = "opt" + i; b.innerHTML = optHTML(op); b.setAttribute("aria-pressed", cur === i ? "true" : "false"); o.appendChild(b); });
      p.appendChild(o);
    } else {
      var nr = el("div", "numRow"), lb = el("label", "lbl", t("yourAns")); lb.htmlFor = "numIn";
      var inp = el("input", "numIn"); inp.id = "numIn"; inp.type = "text"; inp.inputMode = "numeric"; inp.autocomplete = "off"; inp.maxLength = 4; inp.placeholder = "?"; inp.value = cur == null ? "" : cur;
      inp.oninput = function () { var x = inp.value.trim(); S.ans[S.task][S.lv] = x === "" ? null : x; savedEl.textContent = x === "" ? "" : t("saved"); var tb = document.getElementById("ver" + S.lv); if (tb) tb.classList.toggle("sv", x !== ""); };
      nr.appendChild(lb); nr.appendChild(inp); p.appendChild(nr);
    }
    p.appendChild(savedEl);
    var row = el("div", "row");
    if (S.lv < 3) { var nb = btn("btn alt", t("nextV"), function () { S.lv++; render(); }); nb.id = "nextV"; row.appendChild(nb); }
    p.appendChild(row);
  }
  function finish(timeUp) { S.timeUp = !!timeUp; S.screen = "result"; S.sure = false; render(); window.scrollTo(0, 0); }
  function resultScreen(p) {
    var tot = total(), n = 0; TASKS.forEach(function (tk, i) { tk.levels.forEach(function (L, j) { if (isRight(L, S.ans[i][j])) n++; }); });
    if (S.timeUp) p.appendChild(el("div", "verdict no", t("timeUp")));
    p.appendChild(el("div", "eyebrow", t("result")));
    var big = el("div", "big"); big.id = "total"; big.innerHTML = '<span dir="ltr">' + tot + "</span>"; p.appendChild(big);
    p.appendChild(el("div", "hint", t("of") + " · " + t("correctN") + n + " / 20"));
    p.appendChild(el("div", "verdict ok", (tot >= 160 ? t("msgHi") : tot >= 90 ? t("msgMid") : t("msgLo")) + " " + t("send")));
    TASKS.forEach(function (tk, i) {
      var rv = el("div", "rv"), h = el("h2"); h.appendChild(el("span", "", tk.icon + " " + tk.name[S.lang])); h.appendChild(el("span", "", taskPts(i) + " / 40")); rv.appendChild(h);
      tk.levels.forEach(function (L, j) {
        var ok = isRight(L, S.ans[i][j]), rl = el("div", "rl");
        var hd = el("div", "hd " + (ok ? "good" : "bad"), stars(j + 1) + "  " + (ok ? "✓" : "✗")); rl.appendChild(hd);
        var a = el("div", "ansline"); a.innerHTML = "<span>" + t("your") + "</span>" + ansHTML(L, S.ans[i][j]); rl.appendChild(a);
        if (!ok) { var c = el("div", "ansline"); c.innerHTML = "<span>" + t("right") + "</span>" + ansHTML(L, L.type === "mc" ? L.ans : String(L.ans)); rl.appendChild(c); }
        rl.appendChild(el("div", "exl", L.ex[S.lang]));
        rv.appendChild(rl);
      });
      p.appendChild(rv);
    });
    var row = el("div", "row"), ab = btn("btn alt", t("again"), function () { S.ans = fresh(); S.screen = "start"; S.timeUp = false; render(); window.scrollTo(0, 0); }); ab.id = "againBtn"; row.appendChild(ab); p.appendChild(row);
  }
  setInterval(function () {
    if (S.screen !== "board" && S.screen !== "task") return;
    var l = left(), tm = document.getElementById("timer");
    if (tm) { tm.textContent = "⏱ " + fmt(l); tm.classList.toggle("low", l < 120000); }
    if (l <= 0) finish(true);
  }, 500);
  document.getElementById("langBtn").onclick = function () {
    S.lang = S.lang === "en" ? "ar" : "en";
    try { localStorage.setItem("miniTestLang", S.lang); } catch (e) {}
    render();
  };
  window.__data = { TASKS: TASKS, LINE: LINE, MAPS: MAPS, PROGS: PROGS, MACH: MACH };
  window.__setLeft = function (sec) { S.end = Date.now() + sec * 1000; };
  render();
})();
</script>

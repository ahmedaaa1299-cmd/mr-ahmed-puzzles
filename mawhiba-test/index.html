<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mawhiba Test Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: one centred column. Header with school logo and teacher. A start screen to pick level and test,
   then four timed sections of four questions each, a results screen, and a review of every answer. */
:root {
  --bg: #EEF0FA; --surface: #FFFFFF; --sunk: #E0E4F5; --ink: #1B1F3B; --muted: #565C80; --line: #BCC3E3;
  --accent: #3D4FC4; --accent-ink: #FFFFFF; --star: #F2A900; --coral: #D9482B; --good: #13804A; --grey: #8A90B4;
  --display: "Baloo Bhaijaan 2", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11142A; --surface: #1C2142; --sunk: #161A35; --ink: #ECEEFB; --muted: #A6ACD0; --line: #353C6B;
    --accent: #8E9BFF; --accent-ink: #11142A; --star: #FFC233; --coral: #FF7A55; --good: #4FD18B; --grey: #6E76A8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11142A; --surface: #1C2142; --sunk: #161A35; --ink: #ECEEFB; --muted: #A6ACD0; --line: #353C6B;
  --accent: #8E9BFF; --accent-ink: #11142A; --star: #FFC233; --coral: #FF7A55; --good: #4FD18B; --grey: #6E76A8; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; margin: 0; }
.app { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 32px; display: flex; flex-direction: column; gap: 14px; }
.app[dir="rtl"] { font-family: "IBM Plex Sans Arabic", var(--body); }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--star); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; } h2 { font-size: 24px; } h3 { font-size: 19px; }
p { margin: 0; }

.top { display: flex; align-items: center; gap: 12px; }
.top img { width: 74px; height: auto; background: #fff; border-radius: 10px; padding: 4px; border: 1px solid var(--line); }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.who b { font-family: var(--display); font-size: 17px; line-height: 1.2; }
.who span { font-size: 13px; color: var(--muted); }
.langBtn { border: 2px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; box-shadow: 0 3px 0 var(--ink); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 12px; }
.bar .stat { display: flex; flex-direction: column; line-height: 1.1; }
.bar .stat small { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
.bar .stat b { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.bar .stat.low b { color: var(--coral); }
.bar .sp { flex: 1; }
.bar button { background: transparent; color: var(--bg); border: 2px solid currentColor; border-radius: 10px; padding: 6px 12px; font-weight: 700; }
.bar button.sure { background: var(--coral); border-color: var(--coral); color: #fff; }

.panel { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 0 var(--ink); }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.facts { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.facts li { background: var(--sunk); border-radius: 8px; padding: 8px 10px; font-weight: 700; font-size: 15px; }
.note { font-size: 14px; color: var(--muted); }
.btn { background: var(--accent); color: var(--accent-ink); border: 2px solid var(--ink); border-radius: 12px; padding: 11px 18px; font-family: var(--display); font-weight: 700; font-size: 19px; box-shadow: 0 4px 0 var(--ink); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: var(--surface); color: var(--ink); }
.btn.small { font-size: 16px; padding: 7px 12px; box-shadow: 0 3px 0 var(--ink); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.sure { background: var(--coral); color: #fff; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: space-between; }

.pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.choice { border: 2px solid var(--ink); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: start; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 3px 0 var(--ink); }
.choice b { font-family: var(--display); font-size: 19px; }
.choice span { font-size: 14px; color: var(--muted); }
.choice[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.choice[aria-pressed="true"] span { color: var(--accent-ink); opacity: .85; }

.sechead { display: flex; align-items: center; gap: 10px; }
.sechead .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--sunk); border: 2px solid var(--ink); display: grid; place-items: center; font-size: 24px; flex: none; }
.qnav { display: flex; gap: 8px; flex-wrap: wrap; }
.qnav button { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--ink); background: var(--surface); font-weight: 800; position: relative; }
.qnav button.done { background: var(--sunk); }
.qnav button.cur { background: var(--ink); color: var(--bg); }
.qnav button.flag::after { content: ""; position: absolute; top: -5px; inset-inline-end: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--star); border: 2px solid var(--ink); }
.passage { background: var(--sunk); border-radius: 10px; padding: 12px 14px; border-inline-start: 5px solid var(--accent); }
.qtext { font-weight: 700; font-size: 19px; }
.kw { display: inline-block; margin-top: 6px; font-size: 21px; letter-spacing: .02em; }
.kwl { border-top: 2px solid var(--ink); padding-top: 4px; margin-top: 4px; }
.eq { direction: ltr; unicode-bidi: isolate; display: inline-block; font-weight: 800; white-space: nowrap; }
.figwrap { display: flex; justify-content: center; }
svg.fig { width: 100%; height: auto; max-width: 420px; display: block; }
.opts { display: grid; gap: 10px; grid-template-columns: 1fr; }
.opts.pics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { display: flex; align-items: center; gap: 10px; border: 2px solid var(--ink); border-radius: 12px; background: var(--surface); padding: 10px 12px; text-align: start; box-shadow: 0 3px 0 var(--ink); min-height: 52px; }
.opts.pics .opt { flex-direction: column; align-items: stretch; }
.opt .let { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 800; background: var(--surface); color: var(--ink); }
.opt.sel { background: var(--accent); color: var(--accent-ink); }
.opt.sel .let { background: var(--star); color: #1B1F3B; }
.opt.right { border-color: var(--good); box-shadow: 0 3px 0 var(--good); background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--ink); }
.opt.wrong { border-color: var(--coral); box-shadow: 0 3px 0 var(--coral); background: color-mix(in srgb, var(--coral) 14%, var(--surface)); color: var(--ink); }
.opt .mark { margin-inline-start: auto; font-weight: 800; }
.opt svg.fig { max-width: 170px; margin: 0 auto; }
.flagBtn { border: 2px dashed var(--ink); background: transparent; border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 14px; }
.flagBtn[aria-pressed="true"] { border-style: solid; background: var(--star); color: #1B1F3B; }
.toast { background: var(--star); color: #1B1F3B; font-weight: 800; border-radius: 10px; padding: 10px 12px; text-align: center; }

.big { font-family: var(--display); font-weight: 800; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.secs { display: flex; flex-direction: column; gap: 8px; }
.secrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.secrow .lbl { font-weight: 700; }
.secrow .val { font-weight: 800; font-variant-numeric: tabular-nums; }
.meter { grid-column: 1 / -1; height: 12px; border-radius: 999px; background: var(--sunk); border: 2px solid var(--ink); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.explain { border: 2px dashed var(--accent); border-radius: 10px; padding: 12px; }
.explain b { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.rvq { border-top: 2px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.rvq:first-of-type { border-top: 0; padding-top: 0; }
.tag { display: inline-block; border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 13px; }
.tag.ok { background: color-mix(in srgb, var(--good) 22%, var(--surface)); color: var(--ink); }
.tag.no { background: color-mix(in srgb, var(--coral) 22%, var(--surface)); color: var(--ink); }
.tag.skip { background: var(--sunk); color: var(--ink); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 14px; }
.tab.cur { background: var(--ink); color: var(--bg); }
.parent { border-top: 2px dashed var(--line); padding-top: 12px; }
.parent b { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.foot { text-align: center; font-size: 13px; color: var(--muted); }

/* figure drawing */
svg .k { stroke: var(--ink); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
svg .kt { stroke: var(--ink); fill: none; stroke-width: 1.5; }
svg .dash { stroke: var(--muted); fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
svg .faint { stroke: var(--line); fill: none; stroke-width: 1.5; }
svg .w { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
svg .b { fill: var(--ink); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
svg .g { fill: var(--grey); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
svg .a { fill: var(--accent); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
svg .s { fill: var(--sunk); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
svg .gear { fill: var(--sunk); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
svg .hole { fill: var(--ink); }
svg .arr { stroke: var(--accent); fill: none; stroke-width: 4; stroke-linecap: round; }
svg .mkf { fill: var(--accent); }
svg .tx { fill: var(--ink); font: 700 17px var(--body); text-anchor: middle; dominant-baseline: central; }
svg .tx.sm { font-size: 13px; font-weight: 700; }
svg .tx.q { font-size: 30px; font-weight: 800; fill: var(--accent); }
svg .sym { fill: var(--ink); font: 800 22px var(--body); text-anchor: middle; dominant-baseline: central; }

@media (max-width: 420px) {
  h1 { font-size: 28px; }
  .top img { width: 60px; }
  .opts.pics { gap: 8px; }
  .opt { padding: 8px; }
}
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>

  function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

    var opts = el("div", "opts" + (q.pics ? " pics" : ""));
    q.o.forEach(function (o, k) {
      var b = btn("opt" + (S.ans[gi] === k ? " sel" : ""), '<span class="let">' + LET[S.lang][k] + "</span><span>" + optContent(o) + "</span>", function () { S.ans[gi] = k; render(); });
      b.setAttribute("aria-pressed", S.ans[gi] === k ? "true" : "false"); opts.appendChild(b);
    });
    p.appendChild(opts);
    var row = el("div", "row end");
    var fb = btn("flagBtn", S.flags[gi] ? "★ " + t("flagged") : "☆ " + t("flag"), function () { S.flags[gi] = !S.flags[gi]; render(); });
    fb.setAttribute("aria-pressed", S.flags[gi] ? "true" : "false"); row.appendChild(fb);
    var nv = el("div", "row");
    var pb = btn("btn small alt", t("prev"), function () { S.qi--; render(); }); pb.disabled = S.qi === 0;
    var last = S.qi === ids.length - 1, nb;
    if (last) {
      nb = btn("btn small" + (S.sureT ? " sure" : ""), S.sureT ? t("sure") : (S.sec >= 3 ? t("finishTest") : t("nextSec")) + " ›", advanceClick); nb.id = "endSec";
    } else { nb = btn("btn small", t("next"), function () { S.qi++; render(); }); nb.id = "nextQ"; }
    nv.appendChild(pb); nv.appendChild(nb); row.appendChild(nv);
    p.appendChild(row);
    if (last) p.appendChild(el("p", "note", S.sureT ? t("sureNote") : t("lastNote")));
    v.appendChild(p);
  }

  function scoreBy() {
    var by = [0, 0, 0, 0], tot = 0;
    questions().forEach(function (q, i) { if (S.ans[i] === q.a) { by[q.s]++; tot++; } });
    return { by: by, tot: tot };
  }
  function viewResult(v) {
    var sc = scoreBy(), p = el("section", "panel");
    p.appendChild(el("p", "eyebrow", t(S.level === "L1" ? "l1" : "l2") + " · " + t(S.set === "A" ? "tA" : "tB")));
    p.appendChild(el("h1", null, t("doneTitle")));
    p.appendChild(el("p", "eyebrow", t("score")));
    p.appendChild(el("div", "big", sc.tot + " / 16"));
    p.appendChild(el("p", null, sc.tot >= 13 ? t("msgHi") : sc.tot >= 9 ? t("msgMid") : t("msgLo")));
    p.appendChild(el("h3", null, t("bySection")));
    var box = el("div", "secs");
    SECS.forEach(function (s, i) {
      var r = el("div", "secrow");
      r.appendChild(el("span", "lbl", s.ic + " " + L(s))); r.appendChild(el("span", "val", sc.by[i] + " / 4"));
      var m = el("div", "meter", '<i style="width:' + (sc.by[i] * 25) + '%"></i>'); r.appendChild(m); box.appendChild(r);
    });
    p.appendChild(box);
    var used = S.used.reduce(function (a, b) { return a + b; }, 0);
    p.appendChild(el("p", "note", t("timeUsed") + ": " + mmss(used) + " / " + mmss(SEC_TIME * 4)));
    var row = el("div", "row");
    var rb = btn("btn", t("review"), function () { S.phase = "review"; S.rvSec = -1; render(); window.scrollTo(0, 0); }); rb.id = "reviewBtn"; row.appendChild(rb);
    row.appendChild(btn("btn alt", t("other"), function () { S.set = S.set === "A" ? "B" : "A"; S.phase = "start"; render(); window.scrollTo(0, 0); }));
    row.appendChild(btn("btn alt", t("again"), function () { S.phase = "start"; render(); window.scrollTo(0, 0); }));
    p.appendChild(row);
    var par = el("div", "parent"); par.appendChild(el("b", null, t("parents"))); par.appendChild(el("p", "note", t("parentsText"))); p.appendChild(par);
    v.appendChild(p);
  }
  function viewReview(v) {
    var p = el("section", "panel");
    var hr = el("div", "row end"); hr.appendChild(el("h2", null, t("reviewTitle")));
    hr.appendChild(btn("btn small alt", t("backRes"), function () { S.phase = "result"; render(); window.scrollTo(0, 0); })); p.appendChild(hr);
    var tabs = el("div", "tabs");
    [-1, 0, 1, 2, 3].forEach(function (s) {
      var b = btn("tab" + (S.rvSec === s ? " cur" : ""), s < 0 ? t("all") : SECS[s].ic + " " + (s + 1), function () { S.rvSec = s; render(); });
      if (s >= 0) b.setAttribute("aria-label", L(SECS[s])); tabs.appendChild(b);
    });
    p.appendChild(tabs);
    questions().forEach(function (q, i) {
      if (S.rvSec >= 0 && q.s !== S.rvSec) return;
      var box = el("div", "rvq");
      var a = S.ans[i], st = a == null ? "skip" : a === q.a ? "ok" : "no";
      box.appendChild(el("div", "row", '<span class="eyebrow">' + t("question") + " " + (i + 1) + " · " + SECS[q.s].ic + '</span><span class="tag ' + st + '">' + t(st) + "</span>"));
      if (q.p) box.appendChild(el("div", "passage", L(q.p)));
      box.appendChild(el("p", "qtext", L(q.q)));
      if (q.fig) box.appendChild(el("div", "figwrap", q.fig(S.lang)));
      var opts = el("div", "opts" + (q.pics ? " pics" : ""));
      q.o.forEach(function (o, k) {
        var cls = "opt" + (k === q.a ? " right" : (k === a ? " wrong" : ""));
        var mark = k === q.a ? "✓" : (k === a ? "✗" : "");
        var d = el("div", cls, '<span class="let">' + LET[S.lang][k] + "</span><span>" + optContent(o) + '</span><span class="mark">' + mark + "</span>");
        opts.appendChild(d);
      });
      box.appendChild(opts);
      box.appendChild(el("div", "explain", "<b>" + t("explanation") + "</b>" + L(q.x)));
      p.appendChild(box);
    });
    v.appendChild(p);
  }

  function render() {
    mkN = 0;
    chrome();
    var v = document.getElementById("view"); v.innerHTML = "";
    if (S.phase === "start") viewStart(v);
    else if (S.phase === "test") viewTest(v);
    else if (S.phase === "result") viewResult(v);
    else viewReview(v);
  }
  document.getElementById("langBtn").onclick = function () {
    S.lang = S.lang === "en" ? "ar" : "en";
    try { localStorage.setItem("mawhibaTestLang", S.lang); } catch (e) {}
    render();
  };
  window.addEventListener("beforeunload", function (e) { if (S.phase === "test") { e.preventDefault(); e.returnValue = ""; } });

  // exposed for automated checks
  window.MawhibaPractice = { BANK: BANK, S: S, key: key, rotCW: rotCW, flipH: flipH, flipV: flipV, norm: norm, SH: { m: SH_MIRROR, r1: SH_ROT1, r2: SH_ROT2 } };
  render();
})();
</script>

</body>
</html>

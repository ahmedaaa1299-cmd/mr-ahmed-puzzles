<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bebras Binary Lamps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Binary Lamps: switch lamps on and off to make a number; level 4 is the card-flip (parity) trick. */
:root {
  --bg: #F4EFE6; --surface: #FFFFFF; --sunk: #EAE2D3; --ink: #2B1E12; --muted: #6E5B47; --line: #D6C8B2;
  --teal: #1F7A6D; --teal-ink: #FFFFFF; --star: #E8A317; --coral: #D24D2C; --good: #13804A;
  --red: #E4572E; --blue: #3E7FDB; --lane0: #7A3B2E; --lane1: #2F6FC7; --lane2: #6B3FA0; --fin: #13804A;
  --display: "Baloo Bhaijaan 2", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A140E; --surface: #2A2119; --sunk: #221B14; --ink: #F3EADC; --muted: #BBA88F; --line: #4A3C2E;
    --teal: #4FC3B3; --teal-ink: #10221F; --star: #FFC233; --coral: #FF7A55; --good: #4FD18B;
    --lane0: #D98A72; --lane1: #6EA8F5; --lane2: #B892F0; --fin: #4FD18B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A140E; --surface: #2A2119; --sunk: #221B14; --ink: #F3EADC; --muted: #BBA88F; --line: #4A3C2E;
  --teal: #4FC3B3; --teal-ink: #10221F; --star: #FFC233; --coral: #FF7A55; --good: #4FD18B;
  --lane0: #D98A72; --lane1: #6EA8F5; --lane2: #B892F0; --fin: #4FD18B; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; margin: 0; }
.app { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 32px; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--star); outline-offset: 2px; }
button:disabled { cursor: default; opacity: .45; }
h1, h2 { font-family: var(--display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; } h2 { font-size: 24px; }
p { margin: 0; }
.top { display: flex; align-items: center; gap: 12px; }
.top img { width: 74px; height: auto; background: #fff; border-radius: 10px; padding: 4px; border: 1px solid var(--line); }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.who b { font-family: var(--display); font-size: 17px; line-height: 1.2; }
.who span { font-size: 13px; color: var(--muted); }
.langBtn { border: 2px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; box-shadow: 0 3px 0 var(--ink); }
.panel { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 0 var(--ink); }
.eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.headrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.score { font-family: var(--display); font-weight: 800; font-size: 20px; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
.score .st { color: var(--star); }
.rules { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.instr { background: var(--sunk); border-radius: 10px; padding: 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.tab .s { color: var(--star); letter-spacing: 1px; }
.tab.cur { background: var(--ink); color: var(--bg); }
.tab.ok::after { content: "✓"; color: var(--good); font-weight: 800; }
.tab.cur.ok::after { color: #7BE0A8; }
.lbl { font-weight: 700; color: var(--muted); font-size: 14px; }
.lineup { display: flex; flex-direction: column; gap: 4px; }
.toks { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 40px; }
.tok { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; line-height: 1; border: 2px solid var(--ink); background: var(--surface); position: relative; }
.tok.red { background: var(--red); } .tok.blue { background: var(--blue); }
.tok.bad::after { content: "✗"; position: absolute; top: -8px; inset-inline-end: -6px; background: var(--coral); color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.tok.miss { opacity: .35; border-style: dashed; }
.arrow { color: var(--muted); font-weight: 800; }
.boardWrap { direction: ltr; display: flex; justify-content: center; }
.board { width: 100%; max-width: 440px; height: auto; display: block; touch-action: manipulation; }
.slot { cursor: pointer; }
.slot rect.box { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 5 4; }
.slot.filled rect.box { stroke-dasharray: none; }
.slot.sel rect.box { stroke: var(--star); stroke-width: 5; stroke-dasharray: none; }
.slot:focus { outline: none; } .slot:focus-visible rect.box { stroke: var(--star); stroke-width: 5; }
.palette { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.pbtn { width: 54px; height: 54px; border-radius: 12px; border: 2px solid var(--ink); background: var(--surface); font-size: 26px; box-shadow: 0 3px 0 var(--ink); display: grid; place-items: center; padding: 0; }
.pbtn .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); display: block; }
.pbtn.on { background: color-mix(in srgb, var(--star) 40%, var(--surface)); }
.pbtn.x { font-size: 20px; font-weight: 800; }
.hint { text-align: center; font-size: 14px; color: var(--muted); font-weight: 700; min-height: 1.4em; }
.btn { background: var(--teal); color: var(--teal-ink); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 18px; font-family: var(--display); font-weight: 700; font-size: 19px; box-shadow: 0 4px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: var(--surface); color: var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
.res { display: grid; grid-template-columns: 1fr; gap: 8px; }
.resBox { border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.resBox.fin { border-color: var(--fin); }
.verdict { font-weight: 800; text-align: center; border-radius: 10px; padding: 10px; }
.verdict.ok { background: color-mix(in srgb, var(--good) 20%, var(--surface)); }
.verdict.no { background: color-mix(in srgb, var(--coral) 16%, var(--surface)); }
.explain { border: 2px dashed var(--teal); border-radius: 10px; padding: 12px; }
.explain b { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); margin-bottom: 4px; }
.note { font-size: 13px; color: var(--muted); text-align: center; }
.foot { text-align: center; font-size: 13px; color: var(--muted); }
@media (max-width: 420px) { h1 { font-size: 28px; } .pbtn { width: 44px; height: 44px; font-size: 22px; } .pbtn .dot { width: 26px; height: 26px; } .tok { width: 34px; height: 34px; font-size: 19px; } }
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>

<style>
.lamps { direction: ltr; display: flex; justify-content: center; gap: 12px; flex-wrap: nowrap; padding: 8px 0; }
.lampCol { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.lamp { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--ink); background: var(--sunk); display: grid; place-items: center; font-size: 30px; padding: 0; box-shadow: 0 4px 0 var(--ink); }
.lamp.on { background: var(--star); box-shadow: 0 0 0 6px color-mix(in srgb, var(--star) 35%, transparent), 0 4px 0 var(--ink); }
.lamp:active { transform: translateY(2px); }
.val { font-family: var(--display); font-weight: 800; font-size: 22px; min-width: 40px; text-align: center; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); }
.val.q { color: var(--muted); }
.target { text-align: center; font-family: var(--display); font-weight: 800; font-size: 26px; }
.target b { color: var(--teal); font-size: 40px; }
.total { text-align: center; font-weight: 700; color: var(--muted); }
.grid5 { direction: ltr; display: grid; grid-template-columns: repeat(5, 54px); gap: 8px; justify-content: center; padding: 6px 0; }
.card { width: 54px; height: 54px; border-radius: 10px; border: 3px solid var(--ink); padding: 0; background: #FFFDF8; }
.card.dark { background: #2B1E12; border-color: #2B1E12; }
.card.sel { outline: 5px solid var(--star); outline-offset: 2px; }
.card.ans { outline: 5px solid var(--good); outline-offset: 2px; }
@media (max-width: 420px) { .lamp { width: 52px; height: 52px; font-size: 24px; } .lamps { gap: 8px; } .grid5 { grid-template-columns: repeat(5, 48px); } .card { width: 48px; height: 48px; } }
</style>

      rulesC: ["كان في كل صف وكل عمود من هذه البطاقات عدد زوجي من البطاقات الداكنة.", "ثم قلب شخص ما بطاقة واحدة فقط سرًّا.", "اضغط على البطاقة التي تظن أنها قُلبت، ثم اضغط تحقّق."],
      level: "المستوى", make: "كوّن العدد", total: "مصابيحك تكوّن: ", hidden: "قيم المصابيح المكتوب عليها ؟ مخفية. ابحث عن النمط!",
      check: "✓ تحقّق", reset: "↺ ابدأ من جديد", show: "💡 اعرض الحل", next: "المستوى التالي ›",
      okL: "🎉 صحيح! مصابيحك تكوّن بالضبط ", noL1: "ليس بعد. مصابيحك تكوّن ", noL2: ". حاول مرة أخرى.",
      okC: "🎉 صحيح! وجدت البطاقة المقلوبة.", noC: "ليست هذه البطاقة. عُدّ البطاقات الداكنة في كل صف وكل عمود.", pick: "اضغط على بطاقة أولًا.",
      explanation: "الشرح", allDone: "🏆 حللت المستويات الأربعة! الحاسوب يخزّن كل الأعداد بمصابيح مثل هذه: مضاء = 1، مطفأ = 0.",
      note: "نشاط تدريبي لطلابنا على طريقة مهام بيبراس، وليس اختبارًا رسميًا.",
      foot: "أ. أحمد · مدارس الإخاء", on: "مضاء", off: "مطفأ", lamp: "مصباح", card: "بطاقة", row: "الصف", col: "العمود", dark: "داكنة", light: "فاتحة"
    }
  };
  var S = { lang: "en", lv: 0, lamps: LEVELS.map(function (L) { return L.vals ? L.vals.map(function () { return 0; }) : null; }),
            sel: null, solved: [false, false, false, false], tried: [false, false, false, false], result: null, showEx: false };
  try { var sv = localStorage.getItem("lampsLang"); if (sv === "ar" || sv === "en") S.lang = sv; } catch (e) {}
  function t(k) { return TXT[S.lang][k]; }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function btn(cls, txt, fn) { var b = el("button", cls, txt); b.type = "button"; b.onclick = fn; return b; }
  function sum(lv) { var L = LEVELS[lv]; return L.vals.reduce(function (a, v, i) { return a + (S.lamps[lv][i] ? v : 0); }, 0); }
  function answerLamps(L) { var n = L.target; return L.vals.map(function (v) { if (v <= n) { n -= v; return 1; } return 0; }); }
  function stars() { var s = 0; S.solved.forEach(function (ok, i) { if (ok) s += i + 1; }); return s; }
  var view = document.getElementById("view");
  function chrome() {
    document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
    document.title = t("title") + " · Bebras";
    document.getElementById("hSchool").textContent = t("school");
    document.getElementById("hTeacher").textContent = t("teacher");
    document.getElementById("langBtn").textContent = t("lang");
    document.getElementById("foot").textContent = t("foot");
  }
  function go(i) { S.lv = i; S.sel = null; S.result = null; S.showEx = false; render(); }
  function render() {
    chrome(); view.innerHTML = "";
    var L = LEVELS[S.lv], p = el("section", "panel");
    var hr = el("div", "headrow"), hl = el("div");
    hl.appendChild(el("div", "eyebrow", t("eyebrow"))); hl.appendChild(el("h1", "", "💡 " + t("title"))); hr.appendChild(hl);
    var sc = el("div", "score"); sc.id = "score"; sc.innerHTML = '<span class="st">★</span> ' + stars() + " / 10"; hr.appendChild(sc);
    p.appendChild(hr);
    var ins = el("div", "instr"), ol = el("ol", "rules");
    (L.kind === "lamps" ? t("rulesL") : t("rulesC")).forEach(function (r) { ol.appendChild(el("li", "", r)); });
    ins.appendChild(ol); p.appendChild(ins);
    var tabs = el("div", "tabs");
    LEVELS.forEach(function (_, i) {
      var b = btn("tab" + (i === S.lv ? " cur" : "") + (S.solved[i] ? " ok" : ""), "", function () { go(i); });
      b.id = "tab" + i; b.innerHTML = t("level") + ' <span class="s">' + "★★★★".slice(0, i + 1) + "</span>"; b.setAttribute("aria-label", t("level") + " " + (i + 1));
      tabs.appendChild(b);
    });
    p.appendChild(tabs);
    if (L.kind === "lamps") lampBoard(L, p); else cardBoard(p);
    var row = el("div", "row");
    var cb = btn("btn", t("check"), check); cb.id = "checkBtn"; row.appendChild(cb);
    var rb = btn("btn alt", t("reset"), function () { if (L.vals) S.lamps[S.lv] = L.vals.map(function () { return 0; }); S.sel = null; S.result = null; render(); }); rb.id = "resetBtn"; row.appendChild(rb);
    if (S.tried[S.lv] || S.solved[S.lv]) { var sb = btn("btn alt", t("show"), showAnswer); sb.id = "showBtn"; row.appendChild(sb); }
    p.appendChild(row);
    if (S.result) {
      var v = el("div", "verdict " + (S.result.ok ? "ok" : "no"), S.result.msg); v.id = "verdict"; p.appendChild(v);
      if (S.result.ok) {
        var nr = el("div", "row");
        if (S.lv < 3) { var nb = btn("btn", t("next"), function () { go(S.lv + 1); window.scrollTo(0, 0); }); nb.id = "nextBtn"; nr.appendChild(nb); }
        p.appendChild(nr);
        if (S.solved.every(Boolean)) p.appendChild(el("div", "verdict ok", t("allDone")));
      }
    }
    if (S.showEx) { var ex = el("div", "explain"); ex.id = "explain"; ex.appendChild(el("b", "", t("explanation"))); ex.appendChild(el("p", "", L.ex[S.lang])); p.appendChild(ex); }
    p.appendChild(el("p", "note", t("note")));
    view.appendChild(p);
  }
  function lampBoard(L, p) {
    var tg = el("div", "target"); tg.id = "target"; tg.innerHTML = t("make") + ": <b>" + L.target + "</b>"; p.appendChild(tg);
    var box = el("div", "lamps"); box.id = "lamps";
    L.vals.forEach(function (v, i) {
      var col = el("div", "lampCol"), on = S.lamps[S.lv][i];
      var b = btn("lamp" + (on ? " on" : ""), on ? "💡" : "", function () { S.lamps[S.lv][i] = on ? 0 : 1; S.result = null; render(); });
      b.id = "lamp" + i; b.setAttribute("aria-pressed", on ? "true" : "false");
      b.setAttribute("aria-label", t("lamp") + " " + (L.show[i] ? v : "?") + ", " + (on ? t("on") : t("off")));
      col.appendChild(b); col.appendChild(el("span", "val" + (L.show[i] ? "" : " q"), L.show[i] ? String(v) : "?"));
      box.appendChild(col);
    });
    p.appendChild(box);
    if (L.total) { var tt = el("div", "total", t("total") + sum(S.lv)); tt.id = "total"; p.appendChild(tt); }
    if (L.show.indexOf(0) >= 0) p.appendChild(el("div", "hint", t("hidden")));
  }
  function cardBoard(p) {
    var g = el("div", "grid5"); g.id = "grid";
    GRID.forEach(function (r, ri) { r.forEach(function (c, ci) {
      var isSel = S.sel && S.sel[0] === ri && S.sel[1] === ci;
      var isAns = S.showEx && ri === FLIP[0] && ci === FLIP[1];
      var b = btn("card" + (c ? " dark" : "") + (isSel ? " sel" : "") + (isAns ? " ans" : ""), "", function () { S.sel = [ri, ci]; S.result = null; render(); });
      b.id = "card" + ri + ci; b.setAttribute("aria-label", t("card") + ", " + t("row") + " " + (ri + 1) + ", " + t("col") + " " + (ci + 1) + ", " + (c ? t("dark") : t("light")));
      b.setAttribute("aria-pressed", isSel ? "true" : "false");
      g.appendChild(b);
    }); });
    p.appendChild(g);
  }
  function check() {
    var L = LEVELS[S.lv]; S.tried[S.lv] = true;
    if (L.kind === "lamps") {
      var n = sum(S.lv), ok = n === L.target;
      S.result = { ok: ok, msg: ok ? t("okL") + L.target + "." : t("noL1") + n + t("noL2") };
    } else {
      if (!S.sel) { S.result = { ok: false, msg: t("pick") }; render(); return; }
      var okc = S.sel[0] === FLIP[0] && S.sel[1] === FLIP[1];
      S.result = { ok: okc, msg: okc ? t("okC") : t("noC") };
    }
    if (S.result.ok) S.solved[S.lv] = true;
    render();
    var v = document.getElementById("verdict"); if (v && v.scrollIntoView) v.scrollIntoView({ block: "nearest" });
  }
  function showAnswer() {
    var L = LEVELS[S.lv];
    if (L.kind === "lamps") S.lamps[S.lv] = answerLamps(L); else S.sel = FLIP.slice();
    S.result = null; S.showEx = true; render();
  }
  document.getElementById("langBtn").onclick = function () {
    S.lang = S.lang === "en" ? "ar" : "en";
    try { localStorage.setItem("lampsLang", S.lang); } catch (e) {}
    render();
  };
  window.__levels = LEVELS; window.__grid = GRID; window.__flip = FLIP;
  render();
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bebras Practice Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout: one centred column. Header with school logo and teacher; a sticky time/points bar during play;
   a board of five task cards; each task opens with four level tabs like the real contest. */
:root {
  --bg: #EAF4F2; --surface: #FFFFFF; --sunk: #DCEBE8; --ink: #0E2A33; --muted: #4E6A72; --line: #B9D2CE;
  --teal: #0B7A75; --teal-ink: #FFFFFF; --star: #F2A900; --coral: #D9482B; --plum: #6B3FA0; --good: #13804A;
  --display: "Baloo Bhaijaan 2", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1C22; --surface: #13303A; --sunk: #0E252D; --ink: #E8F3F1; --muted: #9DB8BC; --line: #2A4B55;
    --teal: #3CC6BD; --teal-ink: #062A2A; --star: #FFC233; --coral: #FF7A55; --plum: #B892F0; --good: #4FD18B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1C22; --surface: #13303A; --sunk: #0E252D; --ink: #E8F3F1; --muted: #9DB8BC; --line: #2A4B55;
  --teal: #3CC6BD; --teal-ink: #062A2A; --star: #FFC233; --coral: #FF7A55; --plum: #B892F0; --good: #4FD18B; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; margin: 0; }
.app { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 32px; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--star); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 36px; } h2 { font-size: 26px; } h3 { font-size: 20px; }
p { margin: 0; }

/* header */
.top { display: flex; align-items: center; gap: 12px; }
.top img { width: 74px; height: auto; background: #fff; border-radius: 10px; padding: 4px; border: 1px solid var(--line); }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.who b { font-family: var(--display); font-size: 17px; line-height: 1.2; }
.who span { font-size: 13px; color: var(--muted); }
.langBtn { border: 2px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; box-shadow: 0 3px 0 var(--ink); }

/* time / points bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 12px; }
.bar .stat { display: flex; flex-direction: column; line-height: 1.1; }
.bar .stat small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.bar .stat b { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.bar .stat.low b { color: var(--coral); }
.bar .sp { flex: 1; }
.bar button { background: transparent; color: var(--bg); border: 2px solid currentColor; border-radius: 10px; padding: 6px 12px; font-weight: 700; }
.bar button.sure { background: var(--coral); border-color: var(--coral); color: #fff; }

/* cards and panels */
.panel { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 0 var(--ink); }
.eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.facts { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.facts li { background: var(--sunk); border-radius: 8px; padding: 8px 10px; font-weight: 700; font-size: 15px; }
.note { font-size: 14px; color: var(--muted); }
.btn { background: var(--teal); color: var(--teal-ink); border: 2px solid var(--ink); border-radius: 12px; padding: 11px 18px; font-family: var(--display); font-weight: 700; font-size: 19px; box-shadow: 0 4px 0 var(--ink); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: var(--surface); color: var(--ink); }
.btn.small { font-size: 16px; padding: 7px 12px; box-shadow: 0 3px 0 var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* task board */
.tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.tcard { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 4px 0 var(--ink); text-align: center; }
.tcard .ic { font-size: 40px; line-height: 1; }
.tcard b { font-family: var(--display); font-size: 18px; }
.stars { font-size: 20px; letter-spacing: 2px; color: var(--line); white-space: nowrap; }
.stars .on { color: var(--star); }

/* task view */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.tab.cur { background: var(--ink); color: var(--bg); }
.tab .st { color: var(--star); letter-spacing: 1px; }
.tab.ok::after { content: "✓"; color: var(--good); font-weight: 800; }
.tab.cur.ok::after { color: #8ff0bb; }
.taskhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.instr { background: var(--sunk); border-radius: 10px; padding: 12px; }
.play { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 6px 0; }
.say { min-height: 1.5em; font-weight: 700; text-align: center; }
.say.bad { color: var(--coral); } .say.good { color: var(--good); }
.explain { border: 2px dashed var(--teal); border-radius: 10px; padding: 12px; }
.explain b { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); margin-bottom: 4px; }
.ltr { direction: ltr; }
.info { font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.chip { background: var(--star); color: #0E2A33; border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: 14px; }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 80% { transform: translateX(-3px); } }

/* task 1: map */
svg.map { width: 100%; max-width: 520px; height: auto; touch-action: manipulation; }
.map .road { stroke: var(--line); stroke-width: 6; stroke-linecap: round; }
.map .road.on { stroke: var(--teal); stroke-width: 9; }
.map .wbg { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.map .wt { fill: var(--ink); font: 700 14px var(--body); text-anchor: middle; dominant-baseline: central; }
.map .node { fill: var(--surface); stroke: var(--ink); stroke-width: 3; cursor: pointer; }
.map .node.visited { fill: var(--sunk); stroke: var(--teal); }
.map .node.here { fill: var(--star); }
.map .nt { font: 700 17px var(--body); text-anchor: middle; dominant-baseline: central; fill: var(--ink); pointer-events: none; }

/* task 2: robot */
.grid { display: grid; gap: 3px; }
.grid .sq { width: 46px; height: 46px; border-radius: 6px; background: var(--surface); border: 2px solid var(--line); display: grid; place-items: center; font-size: 24px; line-height: 1; }
.grid .wall { background: var(--ink); border-color: var(--ink); }
.grid .goal { color: var(--star); font-size: 28px; }
.grid .trail { background: color-mix(in srgb, var(--teal) 22%, var(--surface)); }
.bot { width: 30px; height: 30px; border-radius: 8px; background: var(--coral); border: 2px solid var(--ink); position: relative; }
.bot::before, .bot::after { content: ""; position: absolute; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--surface); }
.bot::before { left: 5px; } .bot::after { right: 5px; }
.prog { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 420px; }
.prog span { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--line); font-weight: 700; font-size: 18px; }
.prog span.filled { border-color: var(--ink); }
.prog span.live { background: var(--star); color: #0E2A33; }
.keys { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.keys button { width: 46px; height: 46px; border-radius: 10px; border: 2px solid var(--ink); background: var(--surface); font-size: 22px; font-weight: 700; box-shadow: 0 3px 0 var(--ink); padding: 0; }

/* task 3: pixels */
.pix { display: flex; gap: 18px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
.pix figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pix figcaption { font-weight: 700; font-size: 14px; color: var(--muted); }
.pg { display: grid; gap: 2px; background: var(--line); padding: 2px; border-radius: 6px; }
.pg i { display: block; width: 30px; height: 30px; background: var(--surface); }
.pg i.on { background: var(--plum); }
.pg.goal i { width: 22px; height: 22px; }
.ops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 360px; }
.ops button { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 8px; font-weight: 700; box-shadow: 0 3px 0 var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; }
.ops button span { font-size: 20px; }

/* task 4: lockers */
.beavers { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.beaver { border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; background: var(--surface); text-align: center; min-width: 74px; }
.beaver b { display: block; font-family: var(--display); font-size: 20px; }
.bag { font-size: 20px; letter-spacing: 2px; white-space: nowrap; }
.s-c { color: var(--teal); } .s-t { color: var(--coral); } .s-s { color: var(--plum); } .s-r { color: var(--star); }
.lockers { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 440px; }
.locker { display: flex; align-items: center; gap: 10px; border: 2px solid var(--ink); border-radius: 10px; padding: 8px 10px; background: var(--surface); }
.locker .num { font-family: var(--display); font-weight: 800; font-size: 18px; width: 28px; text-align: center; }
.locker .rule { flex: 1; font-weight: 700; }
.locker button { width: 52px; height: 44px; border-radius: 8px; border: 3px dashed var(--ink); background: var(--sunk); font-family: var(--display); font-weight: 800; font-size: 22px; }
.locker button.set { border-style: solid; background: var(--star); color: #0E2A33; }

/* task 5: sort */
.line { display: flex; align-items: flex-end; gap: 2px; justify-content: center; max-width: 100%; overflow-x: auto; padding-bottom: 2px; }
.bv { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.bv .tower { width: 34px; background: var(--teal); border: 2px solid var(--ink); border-radius: 6px 6px 2px 2px; display: grid; place-items: end center; color: var(--teal-ink); font-weight: 800; padding-bottom: 2px; }
.bv .face { font-size: 20px; line-height: 1; }
.swap { align-self: center; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); font-size: 14px; font-weight: 800; padding: 0; margin-bottom: 18px; }

/* review */
.rv { display: flex; flex-direction: column; gap: 10px; }
.rvrow { border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.rvhead { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.rvlv { display: flex; gap: 6px; flex-wrap: wrap; }
.rvlv button { border: 2px solid var(--ink); background: var(--surface); border-radius: 8px; padding: 5px 9px; font-weight: 700; font-size: 14px; }
.rvlv button.ok { background: color-mix(in srgb, var(--good) 22%, var(--surface)); }
.big { font-family: var(--display); font-weight: 800; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; }
.parent { border-top: 2px dashed var(--line); padding-top: 12px; }
.parent b { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.foot { text-align: center; font-size: 13px; color: var(--muted); }

@media (max-width: 420px) {
  h1 { font-size: 30px; }
  .grid .sq { width: 42px; height: 42px; }
  .pg i { width: 26px; height: 26px; } .pg.goal i { width: 18px; height: 18px; }
  .bv .tower { width: 24px; }
  .bv .face { font-size: 16px; }
  .swap { width: 22px; height: 22px; font-size: 12px; }
  .top img { width: 60px; }
}
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } .btn:active { transform: none; } }
</style>

                ar: "اضغط على المحطات بالترتيب لتصنع طريقًا من البيت 🏠 إلى العلم 🚩. الأرقام تبيّن طول كل طريق. ابحث عن أقصر طريق. اضغط على آخر محطة مرة أخرى للتراجع عنها." },
      explain: { en: "The shortest route is {route}, with a total length of {len}. The route with the fewest stops is not always the shortest: add up the numbers before you decide.",
                 ar: "أقصر طريق هو {route}، وطوله الكلي {len}. الطريق الذي فيه أقل عدد من المحطات ليس دائمًا الأقصر، فاجمع الأرقام قبل أن تقرر." },
      viaExplain: { en: " The route must pass through {via}, so find the shortest way to it first, then the shortest way from it to the flag.",
                    ar: " يجب أن يمر الطريق عبر {via}، فابحث أولًا عن أقصر طريق إليه، ثم أقصر طريق منه إلى العلم." },
      levels: [
        { w: 320, h: 300, start: "S", end: "E", via: [], nodes: { S: [40, 150], A: [160, 55], B: [160, 245], E: [280, 150] }, edges: [["S", "A", 2], ["S", "B", 4], ["A", "E", 5], ["B", "E", 1], ["A", "B", 1]] },
        { w: 360, h: 300, start: "S", end: "E", via: [], nodes: { S: [35, 150], A: [125, 55], B: [125, 245], C: [235, 55], D: [235, 245], E: [325, 150] }, edges: [["S", "A", 3], ["S", "B", 1], ["A", "C", 2], ["B", "D", 6], ["A", "B", 1], ["C", "E", 4], ["D", "E", 1], ["C", "D", 2], ["B", "C", 5]] },
        { w: 380, h: 300, start: "S", end: "E", via: ["M"], nodes: { S: [35, 150], A: [115, 50], B: [115, 250], M: [190, 150], C: [270, 50], D: [270, 250], E: [345, 150] }, edges: [["S", "A", 2], ["S", "B", 3], ["A", "M", 4], ["B", "M", 2], ["A", "C", 6], ["M", "C", 1], ["M", "D", 3], ["B", "D", 4], ["C", "E", 3], ["D", "E", 1], ["S", "M", 7]] },
        { w: 400, h: 300, start: "S", end: "E", via: ["M", "K"], nodes: { S: [30, 150], A: [100, 50], B: [100, 250], M: [180, 50], K: [180, 250], C: [235, 150], D: [300, 50], F: [300, 250], E: [370, 150] }, edges: [["S", "A", 2], ["S", "B", 2], ["A", "M", 3], ["B", "K", 3], ["A", "C", 6], ["B", "C", 6], ["M", "C", 2], ["K", "C", 2], ["M", "D", 5], ["K", "F", 5], ["C", "D", 4], ["C", "F", 4], ["D", "E", 2], ["F", "E", 2], ["M", "K", 7]] }
      ] },
    { icon: "🤖", name: { en: "Robot Delivery", ar: "روبوت التوصيل" }, mount: mountRobot,
      prompt: { en: "Write a program with the arrow buttons to take the robot to the star ★, then press Run. The robot cannot pass through the dark blocks. On some levels it must also collect every apple 🍎 on the way.",
                ar: "اكتب برنامجًا بأزرار الأسهم ليصل الروبوت إلى النجمة ★، ثم اضغط شغّل. لا يستطيع الروبوت المرور عبر المربعات الداكنة. في بعض المستويات يجب أن يجمع كل التفاح 🍎 في طريقه." },
      explain: { en: "One correct program is {prog} ({n} steps). Plan the whole route with your finger first, then write the steps. When there are apples, choose the order that wastes the fewest steps.",
                 ar: "من البرامج الصحيحة: {prog} ({n} خطوات). خطّط للطريق كاملًا بإصبعك أولًا، ثم اكتب الخطوات. وإذا كان هناك تفاح، اختر الترتيب الذي لا يضيّع خطوات." },
      levels: [
        { n: 4, start: [3, 0], goal: [0, 3], walls: [], coins: [], slack: 0 },
        { n: 5, start: [4, 0], goal: [0, 0], walls: ["3,0", "3,1", "3,2", "1,2", "1,3", "1,4"], coins: [], slack: 1 },
        { n: 5, start: [4, 0], goal: [0, 4], walls: ["3,1", "2,2", "1,2"], coins: [[2, 1], [1, 3]], slack: 2 },
        { n: 5, start: [2, 2], goal: [4, 4], walls: ["1,1", "1,3", "3,1", "3,3"], coins: [[0, 0], [0, 4]], slack: 0 }
      ] },
    { icon: "🖼️", name: { en: "Pixel Machine", ar: "آلة البكسل" }, mount: mountPixel,
      prompt: { en: "Use the machine buttons to change the picture until it looks exactly like the goal. Count your steps: you may only use the number shown.",
                ar: "استخدم أزرار الآلة لتغيير الصورة حتى تطابق الهدف تمامًا. انتبه لعدد خطواتك: مسموح لك فقط بالعدد المكتوب." },
      explain: { en: "The goal can be reached in {n} steps: {ops}. Compare one row of the picture with the same row of the goal first: has it moved, been mirrored, or have the colours been swapped?",
                 ar: "يمكن الوصول إلى الهدف في {n} خطوات: {ops}. قارن صفًا واحدًا من الصورة بنفس الصف في الهدف أولًا: هل تحرك، أم انعكس، أم تبدلت الألوان؟" },
      levels: [
        { start: ["1000", "1100", "1000", "0000"], ops: ["rgt"] },
        { start: ["1100", "1000", "1000", "1110"], ops: ["inv", "rgt"] },
        { start: ["11000", "10000", "11100", "10000", "11000"], ops: ["mir", "inv", "lft"] },
        { start: ["10100", "11100", "00100", "00110", "00010"], ops: ["rgt", "rgt", "inv", "mir"] }
      ] },
    { icon: "🔐", name: { en: "Beaver Lockers", ar: "خزائن القنادس" }, mount: mountLockers,
      prompt: { en: "Each beaver must go to a different locker. A beaver may use a locker only if its backpack matches the rule on that locker. Tap a locker to choose a beaver for it.",
                ar: "يجب أن يذهب كل قندس إلى خزانة مختلفة. يستطيع القندس استخدام الخزانة فقط إذا كانت حقيبته تطابق القاعدة المكتوبة عليها. اضغط على الخزانة لتختار لها قندسًا." },
      explain: { en: "Answer: {pairs}. Start with the locker that only one beaver fits. After you place him, the other lockers have fewer choices.",
                 ar: "الإجابة: {pairs}. ابدأ بالخزانة التي يناسبها قندس واحد فقط. بعد أن تضعه، تقل الاختيارات في باقي الخزائن." },
      levels: [
        { beavers: { A: "★●●", B: "■■▲", C: "●▲■" }, lockers: [{ t: "has", s: "★" }, { t: "no", s: "●" }, { t: "count", s: "■", n: 1 }] },
        { beavers: { A: "●●▲", B: "★■●", C: "▲▲■", D: "■★★" }, lockers: [{ t: "no", s: "▲" }, { t: "count", s: "★", n: 2 }, { t: "has", s: "●" }, { t: "count", s: "▲", n: 2 }] },
        { beavers: { A: "●▲▲■", B: "▲●●★", C: "■■●▲", D: "★▲■●" }, lockers: [{ t: "more", a: "●", b: "▲" }, { t: "more", a: "■", b: "●" }, { t: "has", s: "★" }, { t: "count", s: "▲", n: 2 }] },
        { beavers: { A: "●●■★", B: "▲■■●", C: "★★▲●", D: "■▲▲●", E: "●★■▲" }, lockers: [{ t: "no", s: "★" }, { t: "more", a: "▲", b: "■" }, { t: "count", s: "●", n: 2 }, { t: "more", a: "★", b: "●" }, { t: "count", s: "■", n: 1 }] }
      ] },
    { icon: "📏", name: { en: "Line Up", ar: "الطابور" }, mount: mountSort,
      prompt: { en: "Sort the beavers from shortest on the left to tallest on the right. You may only swap two beavers who stand next to each other (tap ⇄). Use no more swaps than the number shown.",
                ar: "رتّب القنادس من الأقصر على اليسار إلى الأطول على اليمين. يمكنك فقط تبديل قندسين متجاورين (اضغط ⇄). لا تستخدم تبديلات أكثر من العدد المكتوب." },
      explain: { en: "The smallest number of swaps is {k}. Count the pairs of beavers that are in the wrong order: each swap of two neighbours fixes exactly one such pair, so you need one swap per pair.",
                 ar: "أقل عدد من التبديلات هو {k}. عُدّ أزواج القنادس التي ترتيبها خطأ: كل تبديل بين جارين يصلح زوجًا واحدًا فقط، فتحتاج تبديلًا واحدًا لكل زوج." },
      levels: [ { h: [2, 1, 4, 3] }, { h: [3, 1, 2, 5, 4] }, { h: [4, 2, 6, 1, 5, 3] }, { h: [5, 7, 2, 6, 1, 4, 3] } ] }
  ];

  // ------------------------------------------------------------------ screens
  var view = document.getElementById("view"), bar = document.getElementById("bar");
  var ctrl = null;
  function points() { return S.best.reduce(function (a, b) { return a + b * 10; }, 0); }
  function starStr(n) { var s = ""; for (var i = 0; i < 4; i++) s += '<span class="' + (i < n ? "on" : "") + '">★</span>'; return s; }
  function mmss(s) { return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }

  function chrome() {
    document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
    document.title = t("title");
    document.getElementById("hSchool").textContent = t("school");
    document.getElementById("hTeacher").textContent = t("teacher");
    document.getElementById("langBtn").textContent = t("lang");
    document.getElementById("tLbl").textContent = t("time");
    document.getElementById("pLbl").textContent = t("points");
    document.getElementById("finishBtn").textContent = S.sureT ? t("sure") : t("finish");
    document.getElementById("finishBtn").className = S.sureT ? "sure" : "";
    document.getElementById("foot").textContent = t("foot");
    bar.hidden = !(S.phase === "board" || (S.phase === "task" && S.mode === "play"));
    updateBar();
  }
  function updateBar() {
    document.getElementById("tVal").textContent = mmss(S.remaining);
    document.getElementById("tStat").className = "stat" + (S.remaining <= 120 ? " low" : "");
    document.getElementById("pVal").textContent = points();
  }
  function render() {
    if (ctrl && ctrl.stop) ctrl.stop();
    ctrl = null; view.innerHTML = ""; chrome();
    if (S.phase === "start") return showStart();
    if (S.phase === "board") return showBoard();
    if (S.phase === "task") return showTask();
    if (S.phase === "done") return showDone();
    if (S.phase === "review") return showReview();
  }

  function showStart() {
    var p = el("section", "panel");
    p.appendChild(el("div", "eyebrow", "Bebras · Mawhiba"));
    p.appendChild(el("h1", "", t("title")));
    p.appendChild(el("p", "", t("intro")));
    var ul = el("ul", "facts"); t("facts").forEach(function (f) { ul.appendChild(el("li", "", f)); }); p.appendChild(ul);
    p.appendChild(el("p", "note", t("disclaimer")));
    var r = el("div", "row"); var b = btn("btn", t("start"), startGame); b.id = "startBtn"; r.appendChild(b); p.appendChild(r);
    view.appendChild(p);
  }
  function startGame() {
    S.phase = "board"; S.remaining = 1200; S.timeUp = false;
    clearInterval(S.timer);
    S.timer = setInterval(function () {
      S.remaining--; updateBar();
      if (S.remaining <= 0) { clearInterval(S.timer); S.timeUp = true; S.phase = "done"; render(); }
    }, 1000);
    render();
  }
  function finish() {
    if (!S.sureT) { S.sureT = setTimeout(function () { S.sureT = null; chrome(); }, 3000); chrome(); return; }
    clearTimeout(S.sureT); S.sureT = null; clearInterval(S.timer); S.phase = "done"; render();
  }
  document.getElementById("finishBtn").onclick = finish;
  document.getElementById("langBtn").onclick = function () {
    S.lang = S.lang === "en" ? "ar" : "en";
    try { localStorage.setItem("bebrasPracticeLang", S.lang); } catch (e) {}
    render();
  };

  function showBoard() {
    var grid = el("div", "tasks");
    TASKS.forEach(function (tk, i) {
      var c = btn("tcard", "", function () { S.cur = { t: i, l: Math.min(S.best[i], 3) }; S.mode = "play"; S.phase = "task"; render(); });
      c.id = "task" + i;
      c.innerHTML = '<span class="ic">' + tk.icon + "</span><b>" + L(tk.name) + '</b><span class="stars">' + starStr(S.best[i]) + "</span>";
      grid.appendChild(c);
    });
    view.appendChild(grid);
  }

  function showTask() {
    var tk = TASKS[S.cur.t], lv = S.cur.l, D = tk.levels[lv], play = S.mode === "play", locked = false;
    var p = el("section", "panel");
    var head = el("div", "taskhead");
    head.appendChild(el("h2", "", L(tk.name)));
    head.appendChild(btn("btn small alt", play ? "‹ " + t("back") : "‹ " + t("backReview"), function () { S.phase = play ? "board" : "review"; render(); }));
    p.appendChild(head);
    var tabs = el("div", "tabs");
    for (var i = 0; i < 4; i++) (function (i) {
      var b = btn("tab" + (i === lv ? " cur" : "") + (S.solved[S.cur.t][i] ? " ok" : ""), t("level") + ' <span class="st">' + "★★★★".slice(0, i + 1) + "</span>", function () { S.cur.l = i; render(); });
      b.id = "lv" + i; tabs.appendChild(b);
    })(i);
    p.appendChild(tabs);
    p.appendChild(el("div", "instr", L(tk.prompt)));
    var area = el("div", "play"), say = el("p", "say"); say.setAttribute("aria-live", "polite");
    var api = {
      locked: function () { return locked; },
      say: function (msg, cls) { say.textContent = L(msg); say.className = "say " + (cls || ""); }
    };
    p.appendChild(area);
    ctrl = tk.mount(area, D, api, play ? "play" : "solution");
    p.appendChild(say);
    if (play) {
      var row = el("div", "row");
      var chk = btn("btn", ctrl.isRun ? t("run") : t("check"), function () {
        ctrl.check(function (ok, msg) {
          if (ok) {
            S.solved[S.cur.t][lv] = true; S.best[S.cur.t] = Math.max(S.best[S.cur.t], lv + 1); updateBar();
            api.say(fmt(t("correct"), { l: lv + 1 }), "good"); tabs.children[lv].classList.add("ok");
          } else {
            api.say(msg || t("wrong"), "bad");
            if (!reduced) { area.classList.remove("shake"); void area.offsetWidth; area.classList.add("shake"); }
          }
        });
      });
      chk.id = "checkBtn"; row.appendChild(chk);
      var rs = btn("btn small alt", t("restart"), function () { ctrl.reset(); api.say("", ""); }); rs.id = "resetBtn"; row.appendChild(rs);
      p.appendChild(row);
    } else {
      var f = ctrl.facts(), txt = fmt(L(tk.explain), f);
      if (tk.viaExplain && D.via && D.via.length) txt += fmt(L(tk.viaExplain), f);
      var ex = el("div", "explain"); ex.appendChild(el("b", "", t("explanation"))); ex.appendChild(el("p", "", txt));
      p.appendChild(ex);
    }
    view.appendChild(p);
    window.scrollTo(0, 0);
  }

  function showDone() {
    var p = el("section", "panel");
    p.appendChild(el("div", "eyebrow", S.timeUp ? t("timeUp") : t("doneTitle")));
    p.appendChild(el("div", "big", points() + ' <span style="font-size:.45em">' + t("of") + " 200</span>"));
    var g = el("div", "tasks");
    TASKS.forEach(function (tk, i) { var c = el("div", "tcard"); c.innerHTML = '<span class="ic">' + tk.icon + "</span><b>" + L(tk.name) + '</b><span class="stars">' + starStr(S.best[i]) + "</span>"; g.appendChild(c); });
    p.appendChild(g);
    var r = el("div", "row");
    var rv = btn("btn", t("review"), function () { S.phase = "review"; render(); }); rv.id = "reviewBtn"; r.appendChild(rv);
    r.appendChild(btn("btn small alt", t("again"), reset));
    p.appendChild(r);
    p.appendChild(el("div", "parent", "<b>" + t("parents") + "</b>" + t("parentsText")));
    view.appendChild(p);
    window.scrollTo(0, 0);
  }
  function reset() { S.best = [0, 0, 0, 0, 0]; S.solved = []; for (var i = 0; i < 5; i++) S.solved.push([false, false, false, false]); S.phase = "start"; render(); }

  function showReview() {
    var p = el("section", "panel");
    var head = el("div", "taskhead"); head.appendChild(el("h2", "", t("reviewTitle")));
    head.appendChild(btn("btn small alt", "‹ " + t("score"), function () { S.phase = "done"; render(); }));
    p.appendChild(head);
    p.appendChild(el("p", "note", t("reviewNote")));
    var list = el("div", "rv");
    TASKS.forEach(function (tk, ti) {
      var row = el("div", "rvrow");
      row.appendChild(el("div", "rvhead", "<h3>" + tk.icon + " " + L(tk.name) + '</h3><span class="stars">' + starStr(S.best[ti]) + "</span>"));
      var lv = el("div", "rvlv");
      for (var i = 0; i < 4; i++) (function (i) {
        var ok = S.solved[ti][i];
        var b = btn(ok ? "ok" : "", t("level") + " " + (i + 1) + " · " + (ok ? "✓ " + t("solved") : "✗ " + t("notSolved")), function () { S.cur = { t: ti, l: i }; S.mode = "solution"; S.phase = "task"; render(); });
        b.id = "rv" + ti + "_" + i; lv.appendChild(b);
      })(i);
      row.appendChild(lv); list.appendChild(row);
    });
    p.appendChild(list);
    view.appendChild(p);
    window.scrollTo(0, 0);
  }

  window.BebrasPractice = { bestRouteFor: function (D) { var adj = {}; D.edges.forEach(function (e) { (adj[e[0]] = adj[e[0]] || {})[e[1]] = e[2]; (adj[e[1]] = adj[e[1]] || {})[e[0]] = e[2]; }); return bestRoute(D, adj); }, TASKS: TASKS, robotBFS: robotBFS, pixelBFS: pixelBFS, lockerSolutions: lockerSolutions, inversions: inversions, parseG: parseG, OPS: OPS, state: S };
  render();
})();
</script>

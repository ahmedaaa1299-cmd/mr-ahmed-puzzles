<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bebras Challenge 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout: one centred column. Header with school logo and teacher; a sticky time/answered bar during play;
   a board of six task cards; each task opens with four level tabs. Answers save silently and are only
   marked at the end, like the real contest. */
:root {
  --bg: #F4EFE6; --surface: #FFFFFF; --sunk: #EAE2D3; --ink: #2B1E12; --muted: #6E5B47; --line: #D6C8B2;
  --teal: #1F7A6D; --teal-ink: #FFFFFF; --star: #E8A317; --coral: #D24D2C; --plum: #6B3FA0; --good: #13804A;
  --c1: #2A9D8F; --c2: #F4C430; --c3: #E76F51; --c4: #7B5EA7;
  --display: "Baloo Bhaijaan 2", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A140E; --surface: #2A2119; --sunk: #221B14; --ink: #F3EADC; --muted: #BBA88F; --line: #4A3C2E;
    --teal: #4FC3B3; --teal-ink: #10221F; --star: #FFC233; --coral: #FF7A55; --plum: #B892F0; --good: #4FD18B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A140E; --surface: #2A2119; --sunk: #221B14; --ink: #F3EADC; --muted: #BBA88F; --line: #4A3C2E;
  --teal: #4FC3B3; --teal-ink: #10221F; --star: #FFC233; --coral: #FF7A55; --plum: #B892F0; --good: #4FD18B; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; margin: 0; }
.app { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 32px; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--star); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 36px; } h2 { font-size: 26px; } h3 { font-size: 20px; }
p { margin: 0; }
.top { display: flex; align-items: center; gap: 12px; }
.top img { width: 74px; height: auto; background: #fff; border-radius: 10px; padding: 4px; border: 1px solid var(--line); }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.who b { font-family: var(--display); font-size: 17px; line-height: 1.2; }
.who span { font-size: 13px; color: var(--muted); }
.langBtn { border: 2px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; box-shadow: 0 3px 0 var(--ink); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 12px; }
.bar .stat { display: flex; flex-direction: column; line-height: 1.1; }
.bar .stat small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.bar .stat b { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.bar .stat.low b { color: var(--coral); }
.bar .sp { flex: 1; }
.bar button { background: transparent; color: var(--bg); border: 2px solid currentColor; border-radius: 10px; padding: 6px 12px; font-weight: 700; }
.bar button.sure { background: var(--coral); border-color: var(--coral); color: #fff; }
.panel { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 0 var(--ink); }
.eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.facts { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.facts li { background: var(--sunk); border-radius: 8px; padding: 8px 10px; font-weight: 700; font-size: 15px; }
.facts li.hot { background: var(--star); color: #2B1E12; }
.note { font-size: 14px; color: var(--muted); }
.btn { background: var(--teal); color: var(--teal-ink); border: 2px solid var(--ink); border-radius: 12px; padding: 11px 18px; font-family: var(--display); font-weight: 700; font-size: 19px; box-shadow: 0 4px 0 var(--ink); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: var(--surface); color: var(--ink); }
.btn.small { font-size: 16px; padding: 7px 12px; box-shadow: 0 3px 0 var(--ink); }
.btn.on { background: var(--ink); color: var(--bg); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.tcard { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 4px 0 var(--ink); text-align: center; }
.tcard .ic { font-size: 40px; line-height: 1; }
.tcard b { font-family: var(--display); font-size: 18px; }
.dots { font-size: 18px; letter-spacing: 3px; color: var(--line); white-space: nowrap; }
.dots .on { color: var(--teal); }
.stars { font-size: 20px; letter-spacing: 2px; color: var(--line); white-space: nowrap; }
.stars .on { color: var(--star); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.tab.cur { background: var(--ink); color: var(--bg); }
.tab .st { color: var(--star); letter-spacing: 1px; }
.tab.saved::after { content: "●"; color: var(--teal); }
.tab.ok::after { content: "✓"; color: var(--good); font-weight: 800; }
.tab.no::after { content: "✗"; color: var(--coral); font-weight: 800; }
.taskhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.instr { background: var(--sunk); border-radius: 10px; padding: 12px; }
.ask { font-weight: 800; font-size: 18px; text-align: center; }
.play { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 6px 0; }
.say { min-height: 1.5em; font-weight: 700; text-align: center; color: var(--muted); font-size: 14px; }
.explain { border: 2px dashed var(--teal); border-radius: 10px; padding: 12px; }
.explain b { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); margin-bottom: 4px; }
.ltr { direction: ltr; }
.info { font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.verdict { font-weight: 800; text-align: center; border-radius: 10px; padding: 8px; }
.verdict.ok { background: color-mix(in srgb, var(--good) 18%, var(--surface)); }
.verdict.no { background: color-mix(in srgb, var(--coral) 16%, var(--surface)); }
.verdict.skip { background: var(--sunk); }

/* task 1: cards */
.cards { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.cardw { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.card { width: 54px; height: 76px; border-radius: 8px; border: 2px solid var(--ink); background: var(--surface); padding: 5px; display: grid; place-items: center; box-shadow: 0 3px 0 var(--ink); }
.card.down { background: repeating-linear-gradient(45deg, var(--sunk), var(--sunk) 6px, var(--line) 6px, var(--line) 12px); }
.card .dg { display: grid; gap: 2px; }
.card .dg i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); display: block; }
.card.small { width: 40px; height: 56px; box-shadow: none; }
.card.small .dg i { width: 5px; height: 5px; }
.cardw small { font-weight: 700; color: var(--muted); font-size: 13px; }
.lbl { font-weight: 700; color: var(--muted); font-size: 14px; text-align: center; }

/* task 2: plates */
.instrs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 520px; }
.chip { border-radius: 8px; padding: 4px 8px; font-weight: 800; font-size: 16px; border: 2px solid var(--ink); background: var(--surface); }
.chip.put { background: color-mix(in srgb, var(--teal) 18%, var(--surface)); }
.chip.top { background: color-mix(in srgb, var(--star) 35%, var(--surface)); }
.chip.bot { background: color-mix(in srgb, var(--coral) 25%, var(--surface)); }
.slots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.slots span { width: 40px; height: 40px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.slots span.f { border: 3px solid var(--ink); background: var(--surface); }
.keys { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.keys button { min-width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); font-size: 20px; font-weight: 800; box-shadow: 0 3px 0 var(--ink); padding: 0 6px; }
.keys button.used { opacity: .3; }
.keys button.tool { border-radius: 10px; font-size: 15px; padding: 0 10px; }

/* task 3: beads */
.prog { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: center; font-size: 24px; }
.blk { display: inline-flex; align-items: center; gap: 4px; border: 2px solid var(--ink); border-radius: 10px; padding: 4px 8px; background: var(--sunk); flex-wrap: wrap; }
.blk .rep { font-family: var(--display); font-weight: 800; font-size: 16px; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 0 6px; }
.blk .blk { background: var(--surface); }
.b-c { color: var(--c1); } .b-s { color: var(--c4); } .b-t { color: var(--c3); }
.beads { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; min-height: 34px; font-size: 26px; line-height: 1; max-width: 100%; }
.beads .empty { color: var(--line); font-size: 15px; font-weight: 700; align-self: center; }

/* task 4: fields */
.fields { display: grid; gap: 0; border: 3px solid var(--ink); border-radius: 6px; overflow: hidden; }
.fields .fc { width: 52px; height: 52px; border: 0 solid var(--ink); display: grid; place-items: center; font-size: 18px; font-weight: 800; color: rgba(0,0,0,.55); padding: 0; background: #fff; }
.palette { display: flex; gap: 8px; justify-content: center; }
.palette span { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 800; color: rgba(0,0,0,.55); }

/* task 5: flip */
.pgrid { display: grid; gap: 3px; }
.pgrid button { width: 44px; height: 44px; border-radius: 6px; border: 2px solid var(--ink); background: #fff; padding: 0; position: relative; }
.pgrid button.k { background: #1b1b1b; }
.pgrid button.sel { outline: 4px solid var(--coral); outline-offset: 1px; z-index: 1; }
.pgrid button.sel::after { content: "?"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--coral); font-weight: 800; font-size: 22px; }
.pgrid button.ans { outline: 4px solid var(--good); outline-offset: 1px; z-index: 1; }
.pgrid button.ans::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--good); font-weight: 800; font-size: 22px; }

/* task 6: robot */
.rgrid { display: grid; gap: 3px; }
.rgrid button { width: 50px; height: 50px; border-radius: 6px; border: 2px solid var(--line); background: var(--surface); padding: 0; font-size: 24px; line-height: 1; display: grid; place-items: center; }
.rgrid button.wall { background: var(--ink); border-color: var(--ink); }
.rgrid button.dia { color: var(--plum); }
.rgrid button.trail { background: color-mix(in srgb, var(--teal) 22%, var(--surface)); }
.rgrid button.pick { border: 3px solid var(--coral); }
.rgrid button.end { border: 3px solid var(--good); }
.rgrid .bot { color: var(--coral); font-weight: 800; }

.rv { display: flex; flex-direction: column; gap: 10px; }
.rvrow { border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.rvhead { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.rvlv { display: flex; gap: 6px; flex-wrap: wrap; }
.rvlv button { border: 2px solid var(--ink); background: var(--surface); border-radius: 8px; padding: 5px 9px; font-weight: 700; font-size: 14px; }
.rvlv button.ok { background: color-mix(in srgb, var(--good) 22%, var(--surface)); }
.rvlv button.no { background: color-mix(in srgb, var(--coral) 18%, var(--surface)); }
.big { font-family: var(--display); font-weight: 800; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; }
.parent { border-top: 2px dashed var(--line); padding-top: 12px; }
.parent b { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.foot { text-align: center; font-size: 13px; color: var(--muted); }
@media (max-width: 420px) {
  h1 { font-size: 30px; }
  .top img { width: 60px; }
  .card { width: 46px; height: 66px; padding: 4px; } .card .dg i { width: 6px; height: 6px; }
  .fields .fc { width: 44px; height: 44px; }
  .pgrid button { width: 38px; height: 38px; }
  .rgrid button { width: 46px; height: 46px; }
}
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>

                ar: "قبل الخدعة، كان في كل صف وكل عمود عدد زوجي من المربعات السوداء (0، 2، 4 …). ثم قلب القندس سرًّا مربعًا واحدًا فقط (من أسود إلى أبيض أو العكس). اضغط على المربع الذي قُلب." },
      explain: { en: "The flipped tile is in row {r}, column {c}. Count the black tiles in each row: only one row has an odd number. Do the same for the columns. The flipped tile is where that row and that column meet. Computers use this idea to find mistakes in data.",
                 ar: "المربع المقلوب في الصف {r} والعمود {c}. عُدّ المربعات السوداء في كل صف: صف واحد فقط فيه عدد فردي. افعل الشيء نفسه مع الأعمدة. المربع المقلوب هو حيث يلتقي هذا الصف بهذا العمود. تستخدم الحواسيب هذه الفكرة لاكتشاف الأخطاء في البيانات." },
      levels: [
        { g: ["1010", "0010", "1001", "0011"] },
        { g: ["01100", "01001", "01001", "01110", "01010"] },
        { g: ["111100", "011000", "111111", "011000", "100101", "100111"] },
        { g: ["0111001", "1110111", "1110001", "0000011", "0110011", "0100110", "1101001"] }
      ] }, FLIP),
    Object.assign({ icon: "🤖", name: { en: "Robot Rules", ar: "قواعد الروبوت" },
      prompt: { en: "The arrow shows where the robot starts and which way it faces. At every step it follows this rule: if the square in front of it is free, it moves forward one square. If not (a wall or the edge), it turns right and stays in the same square. A turn counts as a step. Tap the square where the robot is after all the steps.",
                ar: "السهم يبيّن مكان بداية الروبوت والاتجاه الذي ينظر إليه. في كل خطوة يتبع هذه القاعدة: إذا كان المربع الذي أمامه فارغًا يتقدم مربعًا واحدًا. وإذا لم يكن فارغًا (جدار أو حافة) يستدير إلى اليمين ويبقى في مكانه. الاستدارة تُحسب خطوة. اضغط على المربع الذي يكون فيه الروبوت بعد كل الخطوات." },
      extra: { en: "New rule on this level: when the robot moves onto a ◆ square, it also turns left (in the same step).", ar: "قاعدة جديدة في هذا المستوى: عندما يدخل الروبوت مربعًا عليه ◆ يستدير أيضًا إلى اليسار (في نفس الخطوة)." },
      explain: { en: "After {steps} steps the robot is on the square marked ★; its path is shaded. Follow it with your finger and count every step out loud, including the turns.",
                 ar: "بعد {steps} خطوات يكون الروبوت في المربع المعلَّم بـ ★، ومساره مظلل. تتبّعه بإصبعك وعُدّ كل خطوة بصوت عالٍ، ومنها الاستدارات." },
      levels: [
        { n: 4, start: [3, 0], dir: "N", walls: [], steps: 6 },
        { n: 5, start: [4, 0], dir: "N", walls: ["1,0", "0,3", "3,3"], steps: 9 },
        { n: 5, start: [2, 2], dir: "E", walls: ["2,4", "4,3", "0,1", "1,1"], steps: 13 },
        { n: 5, start: [4, 4], dir: "N", walls: ["0,4", "2,1"], dia: ["1,4", "1,1", "3,1"], steps: 12 }
      ] }, ROBOT)
  ];

  // ================================================================== scoring
  function isRight(ti, li) { return TASKS[ti].correct(TASKS[ti].levels[li], S.ans[ti][li]); }
  function best(ti) { var b = 0; for (var i = 0; i < 4; i++) if (isRight(ti, i)) b = i + 1; return b; }
  function points() { var p = 0; for (var i = 0; i < NT; i++) p += best(i) * 10; return p; }
  function answered() { var n = 0; S.ans.forEach(function (r) { r.forEach(function (a) { if (a != null) n++; }); }); return n; }
  function starStr(n) { var s = ""; for (var i = 0; i < 4; i++) s += '<span class="' + (i < n ? "on" : "") + '">★</span>'; return s; }
  function dotStr(ti) { var s = ""; for (var i = 0; i < 4; i++) s += '<span class="' + (S.ans[ti][i] != null ? "on" : "") + '">●</span>'; return s; }
  function mmss(s) { return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }

  // ================================================================== screens
  var view = document.getElementById("view"), bar = document.getElementById("bar");
  function chrome() {
    document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
    document.title = t("title");
    document.getElementById("hSchool").textContent = t("school");
    document.getElementById("hTeacher").textContent = t("teacher");
    document.getElementById("langBtn").textContent = t("lang");
    document.getElementById("tLbl").textContent = t("time");
    document.getElementById("aLbl").textContent = t("answered");
    var fb = document.getElementById("finishBtn"); fb.textContent = S.sureT ? t("sure") : t("finish"); fb.className = S.sureT ? "sure" : "";
    document.getElementById("foot").textContent = t("foot");
    bar.hidden = !(S.phase === "board" || (S.phase === "task" && S.view === "play"));
    updateBar();
  }
  function updateBar() {
    document.getElementById("tVal").textContent = mmss(S.remaining);
    document.getElementById("tStat").className = "stat" + (S.remaining <= 180 ? " low" : "");
    document.getElementById("aVal").textContent = answered() + "/" + NT * 4;
  }
  function render() {
    view.innerHTML = ""; chrome();
    if (S.phase === "start") return showStart();
    if (S.phase === "board") return showBoard();
    if (S.phase === "task") return showTask();
    if (S.phase === "done") return showDone();
    if (S.phase === "review") return showReview();
  }
  function showStart() {
    var p = el("section", "panel");
    p.appendChild(el("div", "eyebrow", "Bebras · Mawhiba"));
    p.appendChild(el("h1", "", t("title")));
    p.appendChild(el("p", "", t("intro")));
    var ul = el("ul", "facts"); t("facts").forEach(function (f, i) { ul.appendChild(el("li", i === 2 ? "hot" : "", f)); }); p.appendChild(ul);
    p.appendChild(el("p", "note", t("disclaimer")));
    var r = el("div", "row"); var b = btn("btn", t("start"), startGame); b.id = "startBtn"; r.appendChild(b); p.appendChild(r);
    view.appendChild(p);
  }
  function startGame() {
    freshAns(); S.phase = "board"; S.remaining = TIME; S.timeUp = false;
    clearInterval(S.timer);
    S.timer = setInterval(function () {
      S.remaining--; updateBar();
      if (S.remaining <= 0) { clearInterval(S.timer); S.timeUp = true; S.phase = "done"; render(); }
    }, 1000);
    render(); window.scrollTo(0, 0);
  }
  function finish() {
    if (!S.sureT) { S.sureT = setTimeout(function () { S.sureT = null; chrome(); }, 3000); chrome(); return; }
    clearTimeout(S.sureT); S.sureT = null; clearInterval(S.timer); S.phase = "done"; render();
  }
  document.getElementById("finishBtn").onclick = finish;
  document.getElementById("langBtn").onclick = function () {
    S.lang = S.lang === "en" ? "ar" : "en";
    try { localStorage.setItem("bebras2Lang", S.lang); } catch (e) {}
    render();
  };
  function showBoard() {
    var grid = el("div", "tasks");
    TASKS.forEach(function (tk, i) {
      var c = btn("tcard", "", function () { var l = 0; while (l < 3 && S.ans[i][l] != null) l++; S.cur = { t: i, l: l }; S.view = "play"; S.phase = "task"; render(); });
      c.id = "task" + i;
      c.innerHTML = '<span class="ic">' + tk.icon + "</span><b>" + L(tk.name) + '</b><span class="dots">' + dotStr(i) + "</span>";
      grid.appendChild(c);
    });
    view.appendChild(grid);
  }
  function showTask() {
    var tk = TASKS[S.cur.t], lv = S.cur.l, D = tk.levels[lv], mode = S.view, ti = S.cur.t;
    var p = el("section", "panel");
    var head = el("div", "taskhead");
    head.appendChild(el("h2", "", tk.icon + " " + L(tk.name)));
    head.appendChild(btn("btn small alt", mode === "play" ? "‹ " + t("back") : "‹ " + t("backReview"), function () { S.phase = mode === "play" ? "board" : "review"; render(); }));
    p.appendChild(head);
    var tabs = el("div", "tabs");
    for (var i = 0; i < 4; i++) (function (i) {
      var st = mode === "play" ? (S.ans[ti][i] != null ? " saved" : "") : (S.ans[ti][i] == null ? "" : isRight(ti, i) ? " ok" : " no");
      var b = btn("tab" + (i === lv ? " cur" : "") + st, t("level") + ' <span class="st">' + "★★★★".slice(0, i + 1) + "</span>", function () { S.cur.l = i; if (mode !== "play") S.view = "mine"; render(); });
      b.id = "lv" + i; tabs.appendChild(b);
    })(i);
    p.appendChild(tabs);
    var ins = el("div", "instr", L(tk.prompt)); if (D.dia && tk.extra) ins.innerHTML += "<br><b>" + L(tk.extra) + "</b>"; p.appendChild(ins);
    if (D.ask) p.appendChild(el("div", "ask", L(D.ask)));
    if (mode !== "play") {
      var a = S.ans[ti][lv], ok = isRight(ti, lv);
      p.appendChild(el("div", "verdict " + (a == null ? "skip" : ok ? "ok" : "no"), a == null ? t("vSkip") : ok ? t("vOk") : t("vNo")));
      var sw = el("div", "row");
      var bm = btn("btn small" + (mode === "mine" ? " on" : " alt"), t("mine"), function () { S.view = "mine"; render(); }); bm.id = "mineBtn";
      var br = btn("btn small" + (mode === "solution" ? " on" : " alt"), t("right"), function () { S.view = "solution"; render(); }); br.id = "rightBtn";
      sw.appendChild(bm); sw.appendChild(br); p.appendChild(sw);
    }
    var area = el("div", "play"), say = el("p", "say"); say.setAttribute("aria-live", "polite");
    p.appendChild(area);
    var state = mode === "solution" ? tk.solve(D) : S.ans[ti][lv];
    var ctx = { mode: mode, state: state, change: function (v) { S.ans[ti][lv] = v; updateBar(); say.textContent = v == null ? t("notYet") : t("saved"); var tb = tabs.children[lv]; tb.classList.toggle("saved", v != null); } };
    var ctrl = tk.mount(area, D, ctx);
    if (mode === "play") {
      say.textContent = S.ans[ti][lv] == null ? t("notYet") : t("saved");
      p.appendChild(say);
      var row = el("div", "row");
      var cl = btn("btn small alt", t("clear"), function () { ctrl.clear(); }); cl.id = "clearBtn"; row.appendChild(cl);
      if (lv < 3) { var nx = btn("btn small", t("level") + " " + (lv + 2) + " ›", function () { S.cur.l = lv + 1; render(); }); nx.id = "nextLv"; row.appendChild(nx); }
      p.appendChild(row);
    } else {
      var ex = el("div", "explain"); ex.appendChild(el("b", "", t("explanation"))); ex.appendChild(el("p", "", fmt(L(tk.explain), tk.facts(D))));
      p.appendChild(ex);
    }
    view.appendChild(p);
    window.scrollTo(0, 0);
  }
  function showDone() {
    var p = el("section", "panel");
    p.appendChild(el("div", "eyebrow", S.timeUp ? t("timeUp") : t("doneTitle")));
    p.appendChild(el("div", "big", points() + ' <span style="font-size:.45em">' + t("of") + " 240</span>"));
    var g = el("div", "tasks");
    TASKS.forEach(function (tk, i) { var c = el("div", "tcard"); c.innerHTML = '<span class="ic">' + tk.icon + "</span><b>" + L(tk.name) + '</b><span class="stars">' + starStr(best(i)) + "</span>"; g.appendChild(c); });
    p.appendChild(g);
    var r = el("div", "row");
    var rv = btn("btn", t("review"), function () { S.phase = "review"; render(); }); rv.id = "reviewBtn"; r.appendChild(rv);
    r.appendChild(btn("btn small alt", t("again"), function () { S.phase = "start"; render(); }));
    p.appendChild(r);
    p.appendChild(el("div", "parent", "<b>" + t("parents") + "</b>" + t("parentsText")));
    view.appendChild(p);
    window.scrollTo(0, 0);
  }
  function showReview() {
    var p = el("section", "panel");
    var head = el("div", "taskhead"); head.appendChild(el("h2", "", t("reviewTitle")));
    head.appendChild(btn("btn small alt", "‹ " + t("score"), function () { S.phase = "done"; render(); }));
    p.appendChild(head);
    p.appendChild(el("p", "note", t("reviewNote")));
    var list = el("div", "rv");
    TASKS.forEach(function (tk, ti) {
      var row = el("div", "rvrow");
      row.appendChild(el("div", "rvhead", "<h3>" + tk.icon + " " + L(tk.name) + '</h3><span class="stars">' + starStr(best(ti)) + "</span>"));
      var lv = el("div", "rvlv");
      for (var i = 0; i < 4; i++) (function (i) {
        var a = S.ans[ti][i], ok = isRight(ti, i);
        var b = btn(a == null ? "" : ok ? "ok" : "no", t("level") + " " + (i + 1) + " · " + (a == null ? "– " + t("skip") : ok ? "✓ " + t("ok") : "✗ " + t("no")), function () { S.cur = { t: ti, l: i }; S.view = a == null ? "solution" : "mine"; S.phase = "task"; render(); });
        b.id = "rv" + ti + "_" + i; lv.appendChild(b);
      })(i);
      row.appendChild(lv); list.appendChild(row);
    });
    p.appendChild(list);
    view.appendChild(p);
    window.scrollTo(0, 0);
  }
  window.addEventListener("beforeunload", function (e) { if (S.phase === "board" || S.phase === "task") { e.preventDefault(); e.returnValue = ""; } });
  window.Bebras2 = { TASKS: TASKS, S: S, points: points, fieldGraph: fieldGraph, robotRun: robotRun, plateRun: plateRun, expand: expand, flipAnswer: flipAnswer };
  render();
})();
</script>
